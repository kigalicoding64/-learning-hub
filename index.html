
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Egreed Technology - AI-Native Learning Ecosystem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-dark': '#0f172a',
              'brand-darker': '#020617',
              'brand-light-blue': '#34d399',
              'brand-blue': '#10b981',
              'brand-secondary': '#1e293b',
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out forwards',
              'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'blob': 'blob 7s infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(30px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
      body { font-family: 'Inter', sans-serif; }
      .bg-grid {
        background-image: radial-gradient(circle at 1px 1px, #1e293b 1px, transparent 0);
        background-size: 40px 40px;
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* Markdown basic styles */
      .markdown-content h1 { font-weight: 900; font-size: 2.25rem; margin-bottom: 1rem; color: white; }
      .markdown-content h2 { font-weight: 800; font-size: 1.875rem; margin-top: 2rem; margin-bottom: 1rem; color: white; }
      .markdown-content h3 { font-weight: 700; font-size: 1.5rem; margin-top: 1.5rem; margin-bottom: 0.75rem; color: white; }
      .markdown-content p { margin-bottom: 1.25rem; line-height: 1.8; color: #cbd5e1; }
      .markdown-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1.25rem; }
      .markdown-content li { margin-bottom: 0.5rem; color: #cbd5e1; }
      .markdown-content strong { color: #34d399; font-weight: 700; }
      .markdown-content code { background-color: #1e293b; padding: 0.2rem 0.4rem; rounded: 0.25rem; font-family: monospace; color: #34d399; }
    </style>
